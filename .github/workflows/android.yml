name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK & NDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x Android/gradlew

      - name: Run Unit Tests
        run: |
          cd Android
          ./gradlew testDebugUnitTest -PincludeHandwriting=false

      - name: Build Debug APK
        run: |
          cd Android
          ./gradlew assembleDebug -PincludeHandwriting=false

      - name: Build Release APK
        run: |
          cd Android
          ./gradlew assembleRelease -PincludeHandwriting=false

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sime-android-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sime-android-release-apk
          path: Android/app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Android/app/build/outputs/apk/release/*.apk
            Android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
