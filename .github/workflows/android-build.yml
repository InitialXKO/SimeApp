name: Android CI - Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Android

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 设置JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 设置Gradle Wrapper
      uses: gradle/actions/setup-gradle@v4

    - name: 接受 Android SDK 与 NDK 许可证
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

    - name: 授予Gradle执行权限
      run: chmod +x gradlew

    - name: 运行单元测试
      run: ./gradlew testDebugUnitTest -PincludeHandwriting=false

    - name: 构建调试版APK
      run: ./gradlew assembleDebug -PincludeHandwriting=false --stacktrace

    - name: 上传调试版APK
      uses: actions/upload-artifact@v4
      with:
        name: sime-debug
        path: Android/app/build/outputs/apk/debug/app-debug.apk

    - name: 构建信息
      run: |
        echo "🎉 构建完成！"
        echo "📦 APK大小: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
        echo "✅ 版本: DEBUG"
