name: Android Release - Build & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例: 0.18.0)'
        required: true
        default: '0.18.0'

permissions:
  contents: write

jobs:
  build-release:
    name: 构建与发布 Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Android

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 设置JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 设置Gradle Wrapper
      uses: gradle/actions/setup-gradle@v4

    - name: 接受 Android SDK 与 NDK 许可证
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

    - name: 授予Gradle执行权限
      run: chmod +x gradlew

    - name: 检查签名 Secrets
      id: check_secrets
      run: |
        if [ -n "${{ secrets.KEYSTORE_FILE }}" ] && [ -n "${{ secrets.KEYSTORE_ALIAS }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
          echo "result=success" >> $GITHUB_OUTPUT
          echo "has_secrets=true" >> $GITHUB_OUTPUT
        else
          echo "result=failure" >> $GITHUB_OUTPUT
          echo "has_secrets=false" >> $GITHUB_OUTPUT
          echo "Some required secrets are missing." >&2
        fi
      shell: bash

    - name: 配置签名密钥
      if: steps.check_secrets.outputs.has_secrets == 'true'
      run: |
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > sime-release.jks
        echo "storeFile=sime-release.jks" > keystore.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" >> keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

    - name: 提取版本号
      id: extract_version
      run: |
        VERSION="${{ github.event.inputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_ENV

    - name: 构建发布版APK
      run: |
        if [ -f "keystore.properties" ]; then
          echo "使用签名配置构建..."
          ./gradlew assembleRelease -PincludeHandwriting=false --stacktrace
        else
          echo "⚠️ 未配置签名，构建未签名 Release / 调试版 APK..."
          ./gradlew assembleRelease -PincludeHandwriting=false --stacktrace || ./gradlew assembleDebug -PincludeHandwriting=false --stacktrace
          mkdir -p app/build/outputs/apk/release/
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ] && [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          fi
        fi

    - name: 重命名APK
      run: |
        cd app/build/outputs/apk/release
        TARGET_APK=$(ls *.apk | head -n 1)
        if [ -n "$TARGET_APK" ]; then
          mv "$TARGET_APK" "sime-v${{ env.VERSION }}.apk"
          echo "APK_NAME=sime-v${{ env.VERSION }}.apk" >> $GITHUB_ENV
        fi

    - name: 生成变更日志
      id: changelog
      run: |
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        echo "## 🚀 是语输入法 (Sime) v${{ env.VERSION }}" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### 📱 应用信息" >> $GITHUB_OUTPUT
        echo "- **版本号**: ${{ env.VERSION }}" >> $GITHUB_OUTPUT
        echo "- **包名**: com.shiyu.sime" >> $GITHUB_OUTPUT
        echo "- **平台**: Android" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### 📥 安装说明" >> $GITHUB_OUTPUT
        echo "1. 下载 `sime-v${{ env.VERSION }}.apk`" >> $GITHUB_OUTPUT
        echo "2. 在 Android 设备上安装并启用是语输入法" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: 创建GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: Android/app/build/outputs/apk/release/${{ env.APK_NAME }}
        body: ${{ steps.changelog.outputs.CHANGELOG }}
        append_body: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 上传Release APK
      uses: actions/upload-artifact@v4
      with:
        name: sime-release
        path: Android/app/build/outputs/apk/release/${{ env.APK_NAME }}

    - name: 构建完成通知
      run: |
        echo "🎉 发布版本构建完成！"
        echo "🏷️  版本: ${{ env.VERSION }}"
        if [ -f "keystore.properties" ]; then
          echo "✅ 签名: 已签名"
        else
          echo "⚠️  签名: 未签名"
        fi
